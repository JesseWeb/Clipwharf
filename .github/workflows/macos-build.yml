name: macOS build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Swift version
        run: swift --version

      - name: Unit tests (ClipwharfCore)
        run: swift test --filter ClipwharfCoreTests

      - name: Build Clipwharf.app
        run: ./scripts/make-app.sh release

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Clipwharf.app Clipwharf-macos.zip
          ls -la

      - name: Upload Clipwharf.app zip
        uses: actions/upload-artifact@v4
        with:
          name: Clipwharf-macos
          path: dist/Clipwharf-macos.zip
          if-no-files-found: error
