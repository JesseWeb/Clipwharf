name: macOS build

# Compile and test check only. Clipwharf publishes no binaries: every user
# builds locally so the app carries their own code signature.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Swift version
        run: swift --version

      # The core target has no AppKit dependency, so these run anywhere.
      - name: Unit tests (ClipwharfCore)
        run: swift test --filter ClipwharfCoreTests

      # Type-checks the AppKit/SwiftUI target and exercises the packaging path
      # (Info.plist copy, icon generation, ad-hoc signing) without publishing
      # an artifact.
      - name: Build app bundle
        run: ./scripts/make-app.sh release

      - name: Check bundle layout
        run: |
          test -x dist/Clipwharf.app/Contents/MacOS/Clipwharf
          test -f dist/Clipwharf.app/Contents/Info.plist
          test -f dist/Clipwharf.app/Contents/Resources/AppIcon.icns
          codesign --verify --strict dist/Clipwharf.app
          echo "Bundle layout OK"
