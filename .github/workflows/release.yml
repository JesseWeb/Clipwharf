name: Release

# Builds a signed, notarized, universal DMG and attaches it to the GitHub
# Release when a v* tag is pushed.
#
# Dormant by design: without the signing secrets this workflow only verifies
# that the app still builds, so forks and pull requests stay green. See
# docs/distribution.md for the secret list.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect signing secrets
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [[ -n "$CERT" && -n "$APPLE_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are absent; building an unsigned app only."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning

      - name: Build universal DMG
        env:
          CLIPWHARF_ARCHS: arm64 x86_64
        run: ./scripts/make-dmg.sh release

      - name: Verify the bundle
        run: |
          APP=dist/Clipwharf.app
          test -x "$APP/Contents/MacOS/Clipwharf"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          codesign --verify --strict --deep "$APP"
          lipo -archs "$APP/Contents/MacOS/Clipwharf"

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/notarize.sh dist/Clipwharf-*.dmg

      - name: Publish release asset
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DMG="$(ls dist/Clipwharf-*.dmg | head -1)"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Clipwharf ${TAG#v}" --generate-notes
          gh release upload "$TAG" "$DMG" --clobber
          echo "Uploaded $DMG to $TAG"
